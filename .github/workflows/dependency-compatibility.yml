name: Dependency compatibility

on:
  pull_request:
  push:
    branches: [main, dev/nv]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pi:
    name: Pi compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/release/app/package-lock.json
      # The compatibility job does not launch Electron or rebuild native addons.
      - name: Install locked desktop dependencies
        run: npm ci --ignore-scripts
      - name: Install locked Pi runtime dependencies
        run: npm --prefix release/app ci --ignore-scripts
      - name: Check the installed Pi dependency tree
        run: npm --prefix release/app ls --depth=0
      - name: Exercise Pi SDK, authentication, sessions, extensions and permissions
        run: npm run test:agent
      - name: Type-check the desktop integration
        run: npm run typecheck
      - name: Build the Electron application
        run: npm run build
      - name: Test desktop permission and agent integration
        run: npm run test:agent-host

  dependencies:
    name: Python dependencies (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install reviewed dependency versions
        run: uv sync --locked --group dev
      - name: Check installed dependency requirements
        run: uv pip check
      - name: Exercise real SDK tool calls against a local API
        run: uv run --locked python -m external_api.dependency_smoke
      - name: Test model adapter and tutor tools
        run: >-
          uv run --locked pytest -q
          lib/external_api/external_api/litellm_test.py
          lib/proactive_tutor/proactive_tutor/agents/tutor_test.py
          lib/proactive_tutor/proactive_tutor/tools
          lib/proactive_tutor/proactive_tutor/pi_bridge_test.py
