name: Package & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "auto = latest stable tag + next patch; or enter a newer version manually"
        required: true
        default: "auto"
        type: string
      release_notes:
        description: "What's new in this version (Markdown supported)"
        required: true
        type: string
      platforms:
        description: "Target platforms"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - windows
          - all

permissions:
  contents: write

concurrency:
  group: coco-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version from current tags
        id: version
        uses: actions/github-script@v7
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        with:
          script: |
            const resolve = require('./desktop/scripts/resolve-release-version.cjs');
            const tags = await github.paginate(github.rest.repos.listTags, { ...context.repo, per_page: 100 });
            const result = resolve(process.env.REQUESTED_VERSION, tags.map(tag => tag.name));
            core.setOutput('version', result.version);
            core.info(`Latest stable tag: ${result.current || '(none)'}; building: ${result.version}`);
            await core.summary.addHeading('Release version').addTable([
              ['Latest stable tag', result.current || '(none)'],
              ['Suggested next version', result.suggested],
              ['Building', result.version],
            ]).write();

      - name: Validate stable release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          node --test desktop/scripts/set-release-version.test.mjs
          node --test desktop/scripts/resolve-release-version.test.cjs
          node desktop/scripts/set-release-version.mjs "$RELEASE_VERSION"
          if [[ -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
            echo "Release notes must describe what's new in this version" >&2
            exit 1
          fi

      - name: Prevent reusing a release tag
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/v${process.env.RELEASE_VERSION}` });
              core.setFailed('This version tag already exists. Choose a new version for an update.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Test packaging recovery tooling
        run: node --test desktop/scripts/package-recovery.test.mjs

      - id: matrix
        run: |
          case "${{ github.event.inputs.platforms }}" in
            macos)
              echo 'result={"include":[{"os":"macos-15","platform":"macos","arch":"arm64"},{"os":"macos-15-intel","platform":"macos-x64","arch":"x64"}]}' >> $GITHUB_OUTPUT
              ;;
            windows)
              echo 'result={"include":[{"os":"windows-latest","platform":"windows","arch":"x64"}]}' >> $GITHUB_OUTPUT
              ;;
            all)
              echo 'result={"include":[{"os":"macos-15","platform":"macos","arch":"arm64"},{"os":"macos-15-intel","platform":"macos-x64","arch":"x64"},{"os":"windows-latest","platform":"windows","arch":"x64"}]}' >> $GITHUB_OUTPUT
              ;;
          esac

  package:
    needs: prepare
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      # Run-scoped checkpoints intentionally have no fallback keys: never mix releases.
      - name: Identify package checkpoint
        id: checkpoint
        shell: bash
        env:
          CHECKPOINT_SOURCE: ${{ github.sha }}
          CHECKPOINT_RUN: ${{ github.run_id }}
          CHECKPOINT_PLATFORM: ${{ matrix.platform }}
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          node -e '
            const { createHash } = require("node:crypto");
            const { appendFileSync } = require("node:fs");
            const values = ["v1", process.env.CHECKPOINT_RUN, process.env.CHECKPOINT_SOURCE,
              process.env.CHECKPOINT_PLATFORM, process.env.RELEASE_VERSION,
              process.env.COCO_GATEWAY_URL, process.env.LLM_ROUTER_URL];
            const key = createHash("sha256").update(JSON.stringify(values)).digest("hex");
            appendFileSync(process.env.GITHUB_OUTPUT, `key=${key}\n`);
          '

      - name: Restore signed macOS app
        if: startsWith(matrix.platform, 'macos')
        id: signed
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/coco-signed.zip
          key: signed-app-${{ steps.checkpoint.outputs.key }}

      - name: Restore service build
        if: steps.signed.outputs.cache-hit != 'true'
        id: services
        uses: actions/cache/restore@v4
        with:
          path: desktop/service-dist
          key: services-${{ steps.checkpoint.outputs.key }}

      - name: Restore Electron downloads
        id: electron-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('desktop/package-lock.json') }}

      - uses: actions/setup-python@v5
        if: steps.signed.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        if: steps.signed.outputs.cache-hit != 'true'
        with:
          version: "latest"

      - name: Install Python dependencies
        if: steps.signed.outputs.cache-hit != 'true'
        run: node desktop/scripts/retry-command.mjs bash -c "uv sync --locked --group dev"

      - name: Check installed dependency requirements
        if: steps.signed.outputs.cache-hit != 'true'
        run: uv pip check

      - name: Check real SDK tool calls before packaging
        if: steps.signed.outputs.cache-hit != 'true'
        run: uv run --locked python -m external_api.dependency_smoke

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: node scripts/retry-command.mjs bash -c "npm ci"

      - name: Save Electron downloads before later steps can fail
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Apply requested app version
        shell: bash
        run: node desktop/scripts/set-release-version.mjs "$RELEASE_VERSION"

      - name: Build services
        if: steps.signed.outputs.cache-hit != 'true' && steps.services.outputs.cache-hit != 'true'
        working-directory: ./desktop
        run: npm run build:services

      - name: Check packaged SDK tool calls before signing
        if: steps.signed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          service="desktop/service-dist/coco-services/tutor-server"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            service="$service.exe"
          fi
          "$service" --dependency-smoke-test

      - name: Save validated service build
        if: steps.signed.outputs.cache-hit != 'true' && steps.services.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: desktop/service-dist
          key: ${{ steps.services.outputs.cache-primary-key }}

      - name: Clean dist
        if: steps.signed.outputs.cache-hit != 'true'
        working-directory: ./desktop
        run: npx ts-node ./.erb/scripts/clean.js dist

      - name: Build Electron app
        if: steps.signed.outputs.cache-hit != 'true'
        working-directory: ./desktop
        run: npm run build

      - name: Validate macOS release secrets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CERT }}
          MAC_CERT_PWD: ${{ secrets.MAC_CERT_PWD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in MAC_CERT MAC_CERT_PWD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build and sign macOS app
        if: startsWith(matrix.platform, 'macos') && steps.signed.outputs.cache-hit != 'true'
        working-directory: ./desktop
        run: node scripts/retry-command.mjs npx electron-builder build --publish never --${{ matrix.arch }} --dir -c.mac.notarize=false
        env:
          CSC_LINK: ${{ secrets.MAC_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PWD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Archive signed app checkpoint
        if: startsWith(matrix.platform, 'macos') && steps.signed.outputs.cache-hit != 'true'
        working-directory: ./desktop
        shell: bash
        run: |
          app_path="$(find release/build -maxdepth 2 -name 'coco.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/coco-signed.zip"

      - name: Save signed app before contacting Apple
        if: startsWith(matrix.platform, 'macos') && steps.signed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/coco-signed.zip
          key: ${{ steps.signed.outputs.cache-primary-key }}

      - name: Restore app and identify notarization checkpoint
        if: startsWith(matrix.platform, 'macos')
        id: notarization
        working-directory: ./desktop
        shell: bash
        run: |
          # ditto preserves framework symlinks, modes, and the code signature.
          mkdir -p release/build/checkpoint
          ditto -x -k "$RUNNER_TEMP/coco-signed.zip" release/build/checkpoint
          echo "APP_PATH=$PWD/release/build/checkpoint/coco.app" >> "$GITHUB_ENV"
          digest="$(shasum -a 256 "$RUNNER_TEMP/coco-signed.zip" | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore Apple submission ID
        if: startsWith(matrix.platform, 'macos')
        id: submission
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/coco-notary.json
          # Tie the submission to the exact signed bytes, even if the app cache was evicted.
          key: notary-${{ steps.checkpoint.outputs.key }}-${{ steps.notarization.outputs.digest }}

      - name: Submit signed app to Apple
        if: startsWith(matrix.platform, 'macos') && steps.submission.outputs.cache-hit != 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node desktop/scripts/notarize-app.mjs submit "$RUNNER_TEMP/coco-signed.zip" "$RUNNER_TEMP/coco-notary.json"

      - name: Save Apple submission ID before waiting
        if: startsWith(matrix.platform, 'macos') && steps.submission.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/coco-notary.json
          key: ${{ steps.submission.outputs.cache-primary-key }}

      - name: Wait for Apple notarization
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        timeout-minutes: 85
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node desktop/scripts/notarize-app.mjs wait "$RUNNER_TEMP/coco-signed.zip" "$RUNNER_TEMP/coco-notary.json"

      - name: Staple notarization ticket
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: node desktop/scripts/retry-command.mjs xcrun stapler staple "$APP_PATH"

      - name: Verify macOS signature and notarization ticket
        if: startsWith(matrix.platform, 'macos')
        working-directory: ./desktop
        shell: bash
        run: |
          app_path="$APP_PATH"
          if [[ -z "$app_path" ]]; then
            echo "Packaged coco.app was not found" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          node scripts/retry-command.mjs spctl --assess --verbose --type exec "$app_path"
          node scripts/retry-command.mjs xcrun stapler validate "$app_path"

      - name: Create installers from notarized macOS app
        if: startsWith(matrix.platform, 'macos')
        working-directory: ./desktop
        run: node scripts/retry-command.mjs npx electron-builder build --publish never --${{ matrix.arch }} --prepackaged "$APP_PATH" -c.mac.notarize=false

      - name: Package Electron app (Windows)
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        working-directory: ./desktop
        run: npx electron-builder build --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coco-installer-${{ matrix.platform }}
          path: |
            desktop/release/build/**/*.dmg
            desktop/release/build/**/*.zip
            desktop/release/build/**/*.exe
          overwrite: true
          retention-days: 7
          compression-level: 6
          if-no-files-found: error

  release:
    needs: [prepare, package]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coco-installer-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Coco v${{ needs.prepare.outputs.version }}
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ inputs.release_notes }}
          files: artifacts/**
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
