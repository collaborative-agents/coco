name: Package & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable app version (must match desktop/release/app/package.json)"
        required: true
        default: "0.1.0"
        type: string
      release_notes:
        description: "What's new in this version (Markdown supported)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate stable release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          release_version="$RELEASE_VERSION"
          package_version="$(node -p "require('./desktop/release/app/package.json').version")"
          lock_version="$(node -p "require('./desktop/release/app/package-lock.json').packages[''].version")"

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be stable semver, for example 0.1.1" >&2
            exit 1
          fi
          if [[ "$release_version" != "$package_version" ]]; then
            echo "Requested version $release_version does not match packaged app version $package_version" >&2
            exit 1
          fi
          if [[ "$package_version" != "$lock_version" ]]; then
            echo "Packaged app version $package_version does not match lockfile version $lock_version" >&2
            exit 1
          fi
          if [[ -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
            echo "Release notes must describe what's new in this version" >&2
            exit 1
          fi

      - name: Test macOS update manifest tooling
        run: node --test desktop/scripts/create-mac-update-manifest.test.mjs

      - id: matrix
        run: |
          echo 'result={"include":[{"os":"macos-15","platform":"macos","arch":"arm64"},{"os":"macos-15-intel","platform":"macos-x64","arch":"x64"},{"os":"windows-latest","platform":"windows","arch":"x64"}]}' >> $GITHUB_OUTPUT

  package:
    needs: prepare
    env:
      COCO_GATEWAY_URL: ${{ vars.COCO_GATEWAY_URL }}
      LLM_ROUTER_URL: ${{ vars.LLM_ROUTER_URL }}
      RELEASE_VERSION: ${{ github.event.inputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Build services
        working-directory: ./desktop
        run: npm run build:services

      - name: Clean dist
        working-directory: ./desktop
        run: npx ts-node ./.erb/scripts/clean.js dist

      - name: Validate study configuration
        shell: bash
        run: |
          : "${COCO_GATEWAY_URL:?Missing repository variable COCO_GATEWAY_URL}"
          : "${LLM_ROUTER_URL:?Missing repository variable LLM_ROUTER_URL}"

          [[ "$COCO_GATEWAY_URL" == https://* ]] || {
            echo "COCO_GATEWAY_URL must use HTTPS" >&2
            exit 1
          }
          [[ "$LLM_ROUTER_URL" == https://* ]] || {
            echo "LLM_ROUTER_URL must use HTTPS" >&2
            exit 1
          }

      - name: Build Electron app
        working-directory: ./desktop
        run: npm run build

      - name: Verify embedded study configuration
        working-directory: ./desktop
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const bundle = fs.readFileSync("release/app/dist/main/main.js", "utf8");
            for (const name of ["COCO_GATEWAY_URL", "LLM_ROUTER_URL"]) {
              const value = process.env[name];
              if (!value || !bundle.includes(value)) {
                throw new Error(`${name} was not embedded in the main bundle`);
              }
            }
          '

      - name: Validate macOS release secrets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CERT }}
          MAC_CERT_PWD: ${{ secrets.MAC_CERT_PWD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in MAC_CERT MAC_CERT_PWD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Package Electron app (macOS signed and notarized)
        if: startsWith(matrix.platform, 'macos')
        working-directory: ./desktop
        run: npx electron-builder build --publish never --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MAC_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PWD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS signature and notarization ticket
        if: startsWith(matrix.platform, 'macos')
        working-directory: ./desktop
        shell: bash
        run: |
          app_path="$(find release/build -maxdepth 2 -name 'coco.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Packaged coco.app was not found" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --verbose --type exec "$app_path"
          xcrun stapler validate "$app_path"

          update_config="$(find release/build -path '*/Contents/Resources/app-update.yml' -print -quit)"
          if [[ -z "$update_config" ]]; then
            echo "Packaged app-update.yml was not found" >&2
            exit 1
          fi
          grep -q 'provider: github' "$update_config"
          grep -q 'owner: collaborative-agents' "$update_config"
          grep -q 'repo: coco' "$update_config"

      - name: Package Electron app (Windows)
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        working-directory: ./desktop
        run: npx electron-builder build --publish never

      - name: Verify Windows differential update metadata
        if: matrix.platform == 'windows'
        working-directory: ./desktop
        shell: bash
        run: |
          update_config="$(find release/build -path '*/resources/app-update.yml' -print -quit)"
          if [[ -z "$update_config" ]]; then
            echo "Packaged Windows app-update.yml was not found" >&2
            exit 1
          fi
          grep -q 'provider: github' "$update_config"
          grep -q 'owner: collaborative-agents' "$update_config"
          grep -q 'repo: coco' "$update_config"

          mapfile -t installers < <(find release/build -maxdepth 1 -type f -name '*.exe' -print)
          if [[ "${#installers[@]}" -ne 1 ]]; then
            echo "Expected exactly one Windows NSIS installer, found ${#installers[@]}" >&2
            exit 1
          fi
          installer="${installers[0]}"
          if [[ ! -f "$installer.blockmap" ]]; then
            echo "Missing Windows differential blockmap: $installer.blockmap" >&2
            exit 1
          fi

          manifest="release/build/latest.yml"
          if [[ ! -f "$manifest" ]]; then
            echo "Windows latest.yml was not generated" >&2
            exit 1
          fi
          grep -Fq "version: $RELEASE_VERSION" "$manifest"
          grep -Fq "$(basename "$installer")" "$manifest"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coco-installer-${{ matrix.platform }}
          path: |
            desktop/release/build/**/*.dmg
            desktop/release/build/**/*.zip
            desktop/release/build/**/*.exe
            desktop/release/build/**/*.blockmap
            desktop/release/build/latest.yml
          retention-days: 7
          compression-level: 6
          if-no-files-found: error

  release:
    needs: package
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create combined macOS update manifest
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          node desktop/scripts/create-mac-update-manifest.mjs \
            --artifacts artifacts \
            --output artifacts/latest-mac.yml \
            --version "$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Coco v${{ github.event.inputs.version }}
          tag_name: v${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          files: artifacts/**
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
