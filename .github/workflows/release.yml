name: Package & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "auto = latest stable tag + next patch; or enter a newer version manually"
        required: true
        default: "auto"
        type: string
      release_notes:
        description: "What's new in this version (Markdown supported)"
        required: true
        type: string
      package_macos_arm64:
        description: "Package macOS for Apple Silicon"
        required: true
        default: true
        type: boolean
      package_macos_x64:
        description: "Package macOS for Intel"
        required: true
        default: true
        type: boolean
      package_windows:
        description: "Package Windows for x64"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: coco-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version from current tags
        id: version
        uses: actions/github-script@v7
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        with:
          script: |
            const resolve = require('./desktop/scripts/resolve-release-version.cjs');
            const tags = await github.paginate(github.rest.repos.listTags, { ...context.repo, per_page: 100 });
            const result = resolve(process.env.REQUESTED_VERSION, tags.map(tag => tag.name));
            core.setOutput('version', result.version);
            core.info(`Latest stable tag: ${result.current || '(none)'}; building: ${result.version}`);
            await core.summary.addHeading('Release version').addTable([
              ['Latest stable tag', result.current || '(none)'],
              ['Suggested next version', result.suggested],
              ['Building', result.version],
            ]).write();

      - name: Validate stable release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          node --test desktop/scripts/set-release-version.test.mjs
          node --test desktop/scripts/resolve-release-version.test.cjs
          node desktop/scripts/set-release-version.mjs "$RELEASE_VERSION"
          if [[ -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
            echo "Release notes must describe what's new in this version" >&2
            exit 1
          fi

      - name: Prevent reusing a release tag
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/v${process.env.RELEASE_VERSION}` });
              core.setFailed('This version tag already exists. Choose a new version for an update.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Test macOS update manifest tooling
        run: node --test desktop/scripts/create-mac-update-manifest.test.mjs

      - name: Build package matrix
        id: matrix
        uses: actions/github-script@v7
        env:
          PACKAGE_MACOS_ARM64: ${{ inputs.package_macos_arm64 }}
          PACKAGE_MACOS_X64: ${{ inputs.package_macos_x64 }}
          PACKAGE_WINDOWS: ${{ inputs.package_windows }}
        with:
          script: |
            const targets = [];

            if (process.env.PACKAGE_MACOS_ARM64 === "true") {
              targets.push({ os: "macos-15", platform: "macos", arch: "arm64" });
            }
            if (process.env.PACKAGE_MACOS_X64 === "true") {
              targets.push({ os: "macos-15-intel", platform: "macos-x64", arch: "x64" });
            }
            if (process.env.PACKAGE_WINDOWS === "true") {
              targets.push({ os: "windows-latest", platform: "windows", arch: "x64" });
            }

            if (targets.length === 0) {
              core.setFailed("Select at least one platform to package");
              return;
            }

            return { include: targets };

  package:
    needs: prepare
    env:
      COCO_GATEWAY_URL: ${{ vars.COCO_GATEWAY_URL || 'https://coco.upskilling.saltlab.stanford.edu' }}
      LLM_ROUTER_URL: ${{ vars.LLM_ROUTER_URL || 'https://coco.router.saltlab.stanford.edu' }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Apply requested app version
        shell: bash
        run: node desktop/scripts/set-release-version.mjs "$RELEASE_VERSION"

      - name: Build services
        working-directory: ./desktop
        run: npm run build:services

      - name: Clean dist
        working-directory: ./desktop
        run: npx ts-node ./.erb/scripts/clean.js dist

      - name: Validate study configuration
        shell: bash
        run: |
          : "${COCO_GATEWAY_URL:?Missing repository variable COCO_GATEWAY_URL}"
          : "${LLM_ROUTER_URL:?Missing repository variable LLM_ROUTER_URL}"

          [[ "$COCO_GATEWAY_URL" == https://* ]] || {
            echo "COCO_GATEWAY_URL must use HTTPS" >&2
            exit 1
          }
          [[ "$LLM_ROUTER_URL" == https://* ]] || {
            echo "LLM_ROUTER_URL must use HTTPS" >&2
            exit 1
          }

      - name: Build Electron app
        working-directory: ./desktop
        run: npm run build

      - name: Verify embedded study configuration
        working-directory: ./desktop
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const bundle = fs.readFileSync("release/app/dist/main/main.js", "utf8");
            for (const name of ["COCO_GATEWAY_URL", "LLM_ROUTER_URL"]) {
              const value = process.env[name];
              if (!value || !bundle.includes(value)) {
                throw new Error(`${name} was not embedded in the main bundle`);
              }
            }
          '

      - name: Test updater and companion windows
        working-directory: ./desktop
        run: npm test -- --runInBand --silent --runTestsByPath src/main/app-updater.test.ts src/main/services/fullscreen-companion-window.test.ts

      - name: Validate macOS release secrets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CERT }}
          MAC_CERT_PWD: ${{ secrets.MAC_CERT_PWD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in MAC_CERT MAC_CERT_PWD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Package Electron app (macOS signed and notarized)
        if: startsWith(matrix.platform, 'macos')
        working-directory: ./desktop
        run: npx electron-builder build --publish never --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MAC_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PWD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS signature and notarization ticket
        if: startsWith(matrix.platform, 'macos')
        working-directory: ./desktop
        shell: bash
        run: |
          app_path="$(find release/build -maxdepth 2 -name 'Coco.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Packaged Coco.app was not found" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --verbose --type exec "$app_path"
          xcrun stapler validate "$app_path"

          update_config="$(find release/build -path '*/Contents/Resources/app-update.yml' -print -quit)"
          if [[ -z "$update_config" ]]; then
            echo "Packaged app-update.yml was not found" >&2
            exit 1
          fi
          grep -q 'provider: github' "$update_config"
          grep -q 'owner: collaborative-agents' "$update_config"
          grep -qx 'repo: coco' "$update_config"

      - name: Package Electron app (Windows)
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        working-directory: ./desktop
        run: npx electron-builder build --publish never

      - name: Verify Windows differential update metadata
        if: matrix.platform == 'windows'
        working-directory: ./desktop
        shell: bash
        run: |
          update_config="$(find release/build -path '*/resources/app-update.yml' -print -quit)"
          if [[ -z "$update_config" ]]; then
            echo "Packaged Windows app-update.yml was not found" >&2
            exit 1
          fi
          grep -q 'provider: github' "$update_config"
          grep -q 'owner: collaborative-agents' "$update_config"
          grep -qx 'repo: coco' "$update_config"

          mapfile -t installers < <(find release/build -maxdepth 1 -type f -name '*.exe' -print)
          if [[ "${#installers[@]}" -ne 1 ]]; then
            echo "Expected exactly one Windows NSIS installer, found ${#installers[@]}" >&2
            exit 1
          fi
          installer="${installers[0]}"
          if [[ ! -f "$installer.blockmap" ]]; then
            echo "Missing Windows differential blockmap: $installer.blockmap" >&2
            exit 1
          fi

          manifest="release/build/latest.yml"
          if [[ ! -f "$manifest" ]]; then
            echo "Windows latest.yml was not generated" >&2
            exit 1
          fi
          grep -Fq "version: $RELEASE_VERSION" "$manifest"
          grep -Fq "$(basename "$installer")" "$manifest"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coco-installer-${{ matrix.platform }}
          path: |
            desktop/release/build/*.dmg
            desktop/release/build/*-mac.zip
            desktop/release/build/*.exe
            desktop/release/build/*.blockmap
            desktop/release/build/latest.yml
          retention-days: 7
          compression-level: 6
          if-no-files-found: error

  release:
    needs: [prepare, package]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create combined macOS update manifest
        if: ${{ inputs.package_macos_arm64 || inputs.package_macos_x64 }}
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node desktop/scripts/create-mac-update-manifest.mjs \
            --artifacts artifacts \
            --output artifacts/latest-mac.yml \
            --version "$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Coco v${{ needs.prepare.outputs.version }}
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.inputs.release_notes }}
          files: artifacts/**
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
