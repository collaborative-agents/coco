[project]
name = "personalization"
version = "0.1.0"
description = "Local personalization pipeline for Coco records, memory, labels, and SFT dataset export."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "external_api",
]

[project.scripts]
coco-personalization = "personalization.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
external_api = { workspace = true }

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
